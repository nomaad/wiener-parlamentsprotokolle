
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiener-protokolle"
version = "0.1.0"
description = "Werkzeuge zum Parsen von parlamentarischen Wortprotokollen der Stadt Wien"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Matthias Zaugg" }
]
keywords = [
    "Wien",
    "Gemeinderat",
    "Parlament",
    "Textanalyse",
    "Sozialwissenschaft"
]
dependencies = [
    "pandas>=2.0",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
